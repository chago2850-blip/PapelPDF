<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2620"/>
      <stop offset="1" stop-color="#120E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#FFE9D6" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#FFE9D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF6"/>
      <stop offset="1" stop-color="#EFE4D1"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F08A50"/>
      <stop offset="1" stop-color="#B4410F"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3B58C"/>
      <stop offset="0.45" stop-color="#D9692F"/>
      <stop offset="1" stop-color="#8F300C"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A3E33"/>
      <stop offset="0.5" stop-color="#6E5D4D"/>
      <stop offset="1" stop-color="#2A221B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="14" stdDeviation="12" flood-color="#2A1408" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- hoja -->
  <g filter="url(#shadow)">
    <path d="M292 196 H600 L736 332 V804 a28 28 0 0 1 -28 28 H292 a28 28 0 0 1 -28 -28 V224 a28 28 0 0 1 28 -28 Z" fill="url(#paper)"/>
  </g>
  <!-- esquina doblada en terracota -->
  <path d="M600 196 V304 a28 28 0 0 0 28 28 H736 Z" fill="url(#fold)"/>
  <path d="M600 196 L736 332" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>

  <!-- renglones -->
  <g stroke="#D9CDB9" stroke-width="18" stroke-linecap="round">
    <line x1="340" y1="414" x2="652" y2="414"/>
    <line x1="340" y1="484" x2="612" y2="484"/>
    <line x1="340" y1="554" x2="560" y2="554"/>
  </g>

  <!-- firma -->
  <path d="M332 712 C 362 664, 392 650, 404 676 C 414 700, 386 736, 410 732 C 442 726, 456 676, 482 680 C 506 684, 486 726, 512 724 C 540 722, 556 694, 590 692"
        fill="none" stroke="#B4410F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- plumilla: punta en (594, 690), cuerpo hacia arriba a la derecha -->
  <g transform="translate(594 690) rotate(40)" filter="url(#soft)">
    <path d="M0 0 C 26 -58, 64 -132, 64 -196 L 64 -238 H -64 V -196 C -64 -132 -26 -58 0 0 Z" fill="url(#nib)"/>
    <path d="M0 -8 V -142" stroke="#5A1D06" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="-158" r="15" fill="#5A1D06"/>
    <path d="M-42 -196 C -40 -150, -20 -90, -4 -40" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-74" y="-300" width="148" height="66" rx="14" fill="url(#collar)"/>
    <rect x="-74" y="-300" width="148" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>
</svg>
